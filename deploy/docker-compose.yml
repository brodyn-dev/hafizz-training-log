services:
  app:
    # Custom-built from our fork (design tweaks) instead of the published image.
    image: dreeve-custom:local
    container_name: dreeve
    restart: unless-stopped
    volumes:
      - ./build:/var/www/build
      - ./storage/database:/var/www/storage/database
      - ./storage/files:/var/www/storage/files
      # Drop your .fit/.tcx/.gpx files in ./watch to have them imported.
      - ./watch:/var/www/watch
      # Local backups. Preferably point this at another disk or a NAS.
      - ./backups:/var/www/backups
    env_file: ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2019/metrics"]
      start_period: 60s
    ports:
      - 8080:8080
    networks:
      - dreeve-network

  # This container runs the recurring background tasks:
  daemon:
    image: dreeve-custom:local
    container_name: dreeve-daemon
    restart: unless-stopped
    volumes:
      - ./build:/var/www/build
      - ./storage/database:/var/www/storage/database
      - ./storage/files:/var/www/storage/files
      - ./watch:/var/www/watch
      - ./backups:/var/www/backups
    env_file: ./.env
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /var/www/storage/database/dreeve.db && echo 'ok' || exit 1"]
      start_period: 5s
    command: ['bin/console', 'app:daemon:run']
    networks:
      - dreeve-network

  # Exposes the app publicly at trainlog.brodynhq.com without opening any router port.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dreeve-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - dreeve-network

networks:
  dreeve-network:
